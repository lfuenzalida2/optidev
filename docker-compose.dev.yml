# Desarrollo: recarga automática de backend (uvicorn --reload) y frontend (Vite
# con HMR). NO usar en producción. Se levanta con `yarn dev` en la raíz, que
# combina este archivo con el compose base. Los comandos de cada servicio
# están en su package.json. Producción sigue siendo `docker compose up -d --build`.
#
# Una migración nueva no se aplica con la recarga (alembic corre solo al
# arrancar el contenedor): `docker compose restart backend`.
services:
  backend:
    build:
      context: ./services/backend
      target: dev
    command: yarn dev
    volumes:
      - ./services/backend/src:/backend/src

  frontend:
    image: optidev-frontend-dev
    build:
      context: ./services/frontend
      target: deps
    # Vite escucha en el 80 del contenedor, como nginx en prod, y hace de
    # proxy de /api y /mcp al backend (ver vite.config.js).
    command: yarn dev
    environment:
      VITE_DEV_PORT: "80"
      VITE_ALLOW_ANY_HOST: "true"
      VITE_BACKEND_PROXY: http://backend:8000
    volumes:
      - ./services/frontend/src:/frontend/src
      - ./services/frontend/public:/frontend/public
      - ./services/frontend/index.html:/frontend/index.html
      - ./services/frontend/vite.config.js:/frontend/vite.config.js
