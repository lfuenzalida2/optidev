services:
  backend:
    build: ./services/backend
    restart: unless-stopped
    env_file: .env
    # Permite apuntar a una base publicada en el host: host.docker.internal:3306.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - optidev-data:/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./services/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  optidev-data:
